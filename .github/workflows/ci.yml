name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated translations are up to date
        run: |
          dart run slang
          git diff --exit-code lib/i18n/strings.g.dart lib/i18n/strings_ar.g.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
